# Per-project backlog config. Read by the capture, develop, and qa skills.
project: <Project Name>

# Where this project's conventions live. Required — these tools carry no standards of their
# own and will stop rather than guess. Relative paths resolve from the repo root.
# If omitted, the skills fall back to the `## Conventions` import in the project's CLAUDE.md;
# if that is absent too, they stop and tell you how to wire it up.
# See: https://github.com/aaron-ferguson/ai-building-conventions
conventions:
  path: ../ai-building-conventions

# Monotonic. capture claims this number for a new item, then increments it.
next_id: 1

# How many entries FINDINGS.md has to hold before a driver stops dispatching tickets and runs a
# retro instead. Read by `./next --findings` (which reports it) and `./next --drive` (which gates
# on it, exit code 5). The default matches retro's stated cadence of about eight entries; raise it
# on a project whose tickets are about a product rather than about this tooling, where the rate is
# inflated because every ticket surfaces a tooling defect. Only the COUNT is read — retro's "or
# weekly if the buffer fills slower" has no fixture and stays a human's judgement.
findings_threshold: 8

# How long a held `.claude/backlog/.lock/` may be before a driver escalates instead of waiting on
# it (`orchestrate` Step 7). Seconds. A lock in use is held for seconds; anything far above that is
# a stage that died holding it, and it blocks every claim and close in the repo until a human
# clears it. Read from the lock DIRECTORY's mtime, never from `held-by`, which the claim path
# writes without a timestamp.
lock_stale_seconds: 900

# Per-stage spend cap a driver passes as `--max-budget-usd`, in USD. DELIBERATELY UNSET: this is
# the one key a template must not fill in. A number shipped here is another project's derivation,
# and a cap below a session's startup floor kills every stage identically while reading exactly
# like a broken CLI.
#
# Fill it from THIS project's own `cost_tracking:` history once there is some — the mean cost per
# session for each stage, with headroom because the mean is not the maximum, plus that mean again
# per ticket beyond the first in a gate — and record the figures it came from beside it, so the
# next person to change it re-derives rather than rounds.
stage_budget_usd:
  develop:
  verify:
  retro:

# Commands qa runs per level. Omit a level the project genuinely doesn't have —
# qa will refuse an item whose qa_level has no command rather than silently skip it.
commands:
  unit: <e.g. pnpm test>
  integration: <e.g. pnpm test:integration>
  e2e: <e.g. pnpm exec playwright test>
  lint: <e.g. pnpm lint>
  typecheck: <e.g. pnpm typecheck>

# Optional. An external issue tracker the backlog mirrors to, ONE WAY. The local
# item stays the source of truth — it carries the FRs, NFR citations, acceptance
# criteria, and QA level a ticket does not. Read references/TRACKER.md before
# enabling. WHICH tracker/project/issue-types is a company-profile question; this
# block records what the profile resolved to, so it is derived once, not per session.
# Omit the whole block for solo projects — the skills then never touch the network.
tracker:
  enabled: false
  type: jira
  site: ""
  project_key: ""            # never guess this; an item in the wrong project is noise
  issue_type_for:
    feature: Story
    bug: Bug
    chore: Task
    debt: Task
  mirror_on: [claim, close, block]

# Optional. Record what each item actually cost when it closes — the only moment
# per-item attribution exists, because only the session that did the work knows
# which item its tokens belonged to. See references/TRACKER.md.
cost_tracking:
  enabled: false
  transcript_dir: ""
  effort_ledger: ""          # human hours: usually the dominant cost term by far

# Optional, and deliberately absent. A project that collects feedback from other humans adds an
# `external_feedback:` block here — WHICH product holds those reports is a profile preference, so
# the base suite ships no default. See references/EXTERNAL-FEEDBACK.md for the block's shape and
# what a source has to provide. With no block, Step 5 sweeps FINDINGS.md and never touches the
# network.
