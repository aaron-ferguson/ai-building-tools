# Per-project backlog config. Read by the capture, develop, and qa skills.
project: <Project Name>

# Where this project's conventions live. Required — these tools carry no standards of their
# own and will stop rather than guess. Relative paths resolve from the repo root.
# If omitted, the skills fall back to the `## Conventions` import in the project's CLAUDE.md;
# if that is absent too, they stop and tell you how to wire it up.
# See: https://github.com/aaron-ferguson/ai-building-conventions
conventions:
  path: ../ai-building-conventions

# Monotonic. capture claims this number for a new item, then increments it.
next_id: 1

# Commands qa runs per level. Omit a level the project genuinely doesn't have —
# qa will refuse an item whose qa_level has no command rather than silently skip it.
commands:
  unit: <e.g. pnpm test>
  integration: <e.g. pnpm test:integration>
  e2e: <e.g. pnpm exec playwright test>
  lint: <e.g. pnpm lint>
  typecheck: <e.g. pnpm typecheck>

# Optional. An external issue tracker the backlog mirrors to, ONE WAY. The local
# item stays the source of truth — it carries the FRs, NFR citations, acceptance
# criteria, and QA level a ticket does not. Read references/TRACKER.md before
# enabling. WHICH tracker/project/issue-types is a company-profile question; this
# block records what the profile resolved to, so it is derived once, not per session.
# Omit the whole block for solo projects — the skills then never touch the network.
tracker:
  enabled: false
  type: jira
  site: ""
  project_key: ""            # never guess this; an item in the wrong project is noise
  issue_type_for:
    feature: Story
    bug: Bug
    chore: Task
    debt: Task
  mirror_on: [claim, close, block]

# Optional. Record what each item actually cost when it closes — the only moment
# per-item attribution exists, because only the session that did the work knows
# which item its tokens belonged to. See references/TRACKER.md.
cost_tracking:
  enabled: false
  transcript_dir: ""
  effort_ledger: ""          # human hours: usually the dominant cost term by far

# Optional. Only for projects collecting feedback from other humans via Notion.
# Omit this whole block for solo projects — capture then never touches the network.
notion:
  enabled: false
  data_source_id: ""
  # Notion property -> what capture reads it as
  title_property: "Name"
  type_property: "Type"
  priority_property: "Priority"
  # Imported pages are recorded here so a re-run never double-imports.
  imported_log: imported-notion-ids.txt
