# Per-project backlog config. Read by the queue, develop, and verify skills.
project: ai-building-tools

# Where this project's conventions live. Required — these tools carry no standards of their
# own and will stop rather than guess. Relative paths resolve from the repo root.
conventions:
  path: ../ai-building-conventions

# Monotonic. queue claims this number for a new ticket, then increments it.
next_id: 105

# How many FINDINGS.md entries before a driver runs a retro instead of the next ticket. Read by
# `./next --findings` and gated on by `./next --drive` (exit 5). Left at retro's stated cadence
# deliberately, even though this repo's buffer is far past it: the rate here is inflated because
# these tickets are *about* the tooling, so every one surfaces a tooling defect, and raising the
# number to make the gate quiet would hide exactly what it exists to show (0036).
findings_threshold: 8

# Where work in this project is tracked.
#   local — this backlog is the source of truth. May live in a public repo.
#   jira  — Jira is the source of truth; this backlog holds a pulled slice, company policy
#           applies to every pushed ticket, and the repo must not be public.
routing:
  default: local
  company: none
  exceptions_allowed: true

# Commands verify runs per level. This project is markdown skills with no test runner, so
# most tickets are qa_level: verify and name a scripted assertion of their own.
# This project has no test runner: the suite is the shell scripts in tests/, each self-contained
# and each printing its own "N passed, M failed" tally. `unit` runs all of them, which is what
# develop Step 5's "the project's whole test suite" means here — there is nothing else to run.
# `unit` is FAIL-FAST, and the two things that read it want opposite behaviour from it. The
# `|| exit 1` ends the loop at the first red file, so nothing after it runs. That is right for
# `tools/release` step 5, which uses this same line as a release gate. It is wrong for a QA pass:
# verifying 0084 at this level, backlog-scripts-installed.test.sh failed on another session's
# in-flight work — alphabetically first of seventeen — and the run stopped there, so
# tests/release.test.sh, the guard that verdict actually rested on, never executed. Sixteen were
# green. A verify session trusting the first failure reports BLOCKED or FAIL on someone else's
# red, and the masking is an alphabetical accident that will not repeat reliably. To attribute a
# red, run the files individually instead: for t in tests/*.test.sh; do "$t" || true; done
commands:
  unit: for t in tests/*.test.sh; do "$t" || exit 1; done
  integration:
  e2e:
  lint:
  typecheck:
