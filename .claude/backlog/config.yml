# Per-project backlog config. Read by the queue, develop, and verify skills.
project: ai-building-tools

# Where this project's conventions live. Required — these tools carry no standards of their
# own and will stop rather than guess. Relative paths resolve from the repo root.
conventions:
  path: ../ai-building-conventions

# Monotonic: this counter only ever rises. `queue` claims this number for a new ticket, then
# increments it. A withdrawal burns the id and keeps the item file as the record — queue's
# "Withdrawing a ticket" section carries both rules, and tests/citations.test.sh guards them.
#
# 0104 IS BURNED, NOT AVAILABLE, and its history is worth keeping because both ways of losing an
# id happened to the same number. It was never issued to the work that cited it: a retro landed
# that directly at b9a5ee0 on 2026-09-05 with no row, no item file and no id claim, and labelled
# five guard cases 0104 regardless. The id was afterwards issued for real, to an unrelated ticket
# (7764732), and withdrawn at 3b72d38 — a withdrawal that decremented this counter from 105 back
# to 104 and so queued up a reissue those five citations would have silently followed. The
# 2026-09-07 retro set this to 111 and left 0104 unissued. Item 0105 then repointed the five at
# b9a5ee0, which resolves permanently, and gave the withdrawal path the rules it never had.
next_id: 115

# How many FINDINGS.md entries before a driver runs a retro instead of the next ticket. Read by
# `./next --findings` and gated on by `./next --drive` (exit 5). Left at retro's stated cadence
# deliberately, even though this repo's buffer is far past it: the rate here is inflated because
# these tickets are *about* the tooling, so every one surfaces a tooling defect, and raising the
# number to make the gate quiet would hide exactly what it exists to show (0036).
findings_threshold: 8

# How long a held `.claude/backlog/.lock/` may be before a driver escalates instead of waiting on
# it (`orchestrate` Step 7). A lock in use is held for seconds; every figure above it is a stage
# that died holding it, which blocks every future claim and close in the repo until a human clears
# it. 900s is two orders of magnitude above the normal hold and well under a stage's own runtime,
# so a live stage is never escalated and a dead one is not waited on for a session.
#
# Read from the lock DIRECTORY's mtime, never from `held-by`: `claim` writes no timestamp there
# where `close` and `handoff` both do, so the commonest holder is the one a timestamp read cannot
# see. Fixing `claim` is not the driver's job and STILL NEEDS A ROW — 0047 is the busy-lock
# procedure, which is a different question.
lock_stale_seconds: 900

# Per-stage spend cap a driver passes as `--max-budget-usd`, in USD.
#
# DERIVED, NOT CHOSEN. Every figure is MEASUREMENT.md's "Per stage, which is what a reduction is
# aimed at" table, `$/session` column, 30 sessions as at 2026-08-30: develop 4.03, verify 3.63,
# retro 2.51 per session. Each base is that mean times 1.5, because the mean is not the maximum and
# a cap that fires mid-work is strictly worse than no cap — it leaves a held claim, a dirty tree and
# possibly a taken lock. `per_extra_ticket` is the same mean again, added once per ticket beyond the
# first in a gate, since a gate's saving is the startup floor and not the work.
#
# RECOMPUTE from that table rather than rounding these; a quoted figure is a cache of another file,
# and this repo has already shipped one that went stale. A cap below a session's ~20k-token startup
# floor fails every stage identically and reads exactly like a broken CLI.
stage_budget_usd:
  develop: 6.05          # 4.03 x 1.5
  verify: 5.45           # 3.63 x 1.5
  retro: 3.75            # 2.51 x 1.5
  per_extra_ticket:
    develop: 4.03
    verify: 3.63

# Where work in this project is tracked.
#   local — this backlog is the source of truth. May live in a public repo.
#   jira  — Jira is the source of truth; this backlog holds a pulled slice, company policy
#           applies to every pushed ticket, and the repo must not be public.
routing:
  default: local
  company: none
  exceptions_allowed: true

# Commands verify runs per level. This project is markdown skills with no test runner, so
# most tickets are qa_level: verify and name a scripted assertion of their own.
# This project has no test runner: the suite is the shell scripts in tests/, each self-contained
# and each printing its own "N passed, M failed" tally. `unit` runs all of them, which is what
# develop Step 5's "the project's whole test suite" means here — there is nothing else to run.
# `unit` is FAIL-FAST, and the two things that read it want opposite behaviour from it. The
# `|| exit 1` ends the loop at the first red file, so nothing after it runs. That is right for
# `tools/release` step 5, which uses this same line as a release gate. It is wrong for a QA pass:
# verifying 0084 at this level, backlog-scripts-installed.test.sh failed on another session's
# in-flight work — alphabetically first of seventeen — and the run stopped there, so
# tests/release.test.sh, the guard that verdict actually rested on, never executed. Sixteen were
# green. A verify session trusting the first failure reports BLOCKED or FAIL on someone else's
# red, and the masking is an alphabetical accident that will not repeat reliably. To attribute a
# red, run the files individually instead: for t in tests/*.test.sh; do "$t" || true; done
commands:
  unit: for t in tests/*.test.sh; do "$t" || exit 1; done
  integration:
  e2e:
  lint:
  typecheck:
